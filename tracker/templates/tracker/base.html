{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Pennywise{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'tracker/style.css' %}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{% url 'home' %}">Pennywise</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">?</button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto">{% if user.is_authenticated %}<a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a><a class="nav-link" href="{% url 'transactions' %}">History</a><a class="nav-link" href="{% url 'tutorials' %}">Tutorials</a><a class="nav-link" href="{% url 'password_change' %}">Password</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-link nav-link">Logout</button></form>{% else %}<a class="nav-link" href="{% url 'login' %}">Login</a><a class="nav-link" href="{% url 'register' %}">Register</a><a class="nav-link" href="{% url 'tutorials' %}">Tutorials</a>{% endif %}</div></div></div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
