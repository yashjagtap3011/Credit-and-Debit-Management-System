{% extends 'tracker/base.html' %}{% block content %}<h1>Reports</h1><div class="table-responsive"><table class="table"><thead><tr><th>Type</th><th>Category</th><th>Transactions</th><th>Total</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.transaction_type|title }}</td><td>{{ r.category }}</td><td>{{ r.count }}</td><td>{{ r.total }}</td></tr>{% empty %}<tr><td colspan="4">No report data yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
