<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th class="text-end">Amount</th><th></th></tr></thead><tbody>{% for t in transactions %}<tr><td>{{ t.date }}</td><td><span class="badge {% if t.transaction_type == 'credit' %}bg-success{% else %}bg-danger{% endif %}">{{ t.get_transaction_type_display }}</span></td><td>{{ t.category }}</td><td>{{ t.description }}</td><td class="text-end">{{ t.amount }}</td><td><a href="{% url 'transaction_edit' t.pk %}">Edit</a> ? <a href="{% url 'transaction_delete' t.pk %}">Delete</a></td></tr>{% empty %}<tr><td colspan="6" class="text-muted">No transactions yet.</td></tr>{% endfor %}</tbody></table></div>
