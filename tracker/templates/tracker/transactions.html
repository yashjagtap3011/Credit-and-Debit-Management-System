{% extends 'tracker/base.html' %}{% block content %}<h1>Transaction history</h1><form class="row g-2 mb-3"><div class="col-md"><select class="form-select" name="type"><option value="">All types</option><option value="credit" {% if filters.type == 'credit' %}selected{% endif %}>Credit</option><option value="debit" {% if filters.type == 'debit' %}selected{% endif %}>Debit</option></select></div><div class="col-md"><input class="form-control" name="category" placeholder="Category" value="{{ filters.category }}"></div><div class="col-md"><input class="form-control" type="date" name="date" value="{{ filters.date }}"></div><div class="col-md"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" value="{{ filters.amount }}"></div><div class="col-auto"><button class="btn btn-primary">Filter</button></div></form><a href="{% url 'transaction_add' 'credit' %}" class="btn btn-success">Add credit</a> <a href="{% url 'transaction_add' 'debit' %}" class="btn btn-danger">Add debit</a>{% include 'tracker/table.html' %}{% endblock %}
