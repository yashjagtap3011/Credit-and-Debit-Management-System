{% extends 'tracker/base.html' %}{% block content %}<h1>Tutorials</h1><div class="row g-3">{% for t in tutorials %}<div class="col-md-6 col-lg-4"><a class="card p-3 h-100 tutorial-card" href="{{ t.get_absolute_url }}"><span class="text-primary">{{ t.category }}</span><h2 class="h5 mt-2">{{ t.title }}</h2><p>{{ t.description }}</p></a></div>{% empty %}<p>No tutorials published yet. Check back soon.</p>{% endfor %}</div>{% endblock %}
